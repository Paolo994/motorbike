<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · MotoRide'">MotoRide</title>
    <meta th:if="${_csrf}" name="_csrf" th:content="${_csrf.token}">
    <meta th:if="${_csrf}" name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="app-context" th:content="@{/}">
    <meta sec:authorize="isAuthenticated()" name="app-user" th:content="${#authentication.name}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-speedometer2 text-warning"></i> MotoRide</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Apri menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto" sec:authorize="isAuthenticated()">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/friends}">
                        Amici
                        <span th:if="${pendingFriendRequests != null and pendingFriendRequests > 0}" class="badge rounded-pill text-bg-warning"
                              th:text="${pendingFriendRequests}"
                              title="Richieste di amicizia in attesa">1</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/chat}">
                        Chat
                        <span id="chat-badge" class="badge rounded-pill text-bg-warning"
                              th:classappend="${unreadMessages == null or unreadMessages == 0} ? 'd-none'"
                              th:text="${unreadMessages}" title="Messaggi non letti">0</span>
                    </a>
                </li>
                <li class="nav-item"><a class="nav-link" th:href="@{/news}">Notizie</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/trips}">Road trip</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-warning" th:href="@{/admin}">
                        <i class="bi bi-shield-lock"></i> Admin
                        <span th:if="${pendingPhotos != null and pendingPhotos > 0}" class="badge rounded-pill text-bg-warning"
                              th:text="${pendingPhotos}" title="Foto da approvare">1</span>
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <th:block sec:authorize="isAnonymous()">
                    <li class="nav-item"><a class="nav-link" th:href="@{/login}">Accedi</a></li>
                    <li class="nav-item"><a class="btn btn-warning btn-sm ms-lg-2" th:href="@{/register}">Registrati</a></li>
                </th:block>
                <th:block sec:authorize="isAuthenticated()">
                    <li class="nav-item">
                        <a class="nav-link position-relative" th:href="@{/notifications}" aria-label="Notifiche" title="Notifiche">
                            <i class="bi bi-bell fs-5"></i>
                            <span id="notif-badge" class="badge rounded-pill text-bg-danger notif-badge"
                                  th:classappend="${unreadNotifications == null or unreadNotifications == 0} ? 'd-none'"
                                  th:text="${unreadNotifications}">0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/profile}">
                            <i class="bi bi-person-circle"></i> <span sec:authentication="name">utente</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-light btn-sm ms-lg-2">Esci</button>
                        </form>
                    </li>
                </th:block>
            </ul>
        </div>
    </div>
</nav>

<th:block th:fragment="flash">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${info}" class="alert alert-info" th:text="${info}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
</th:block>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <th:block sec:authorize="isAuthenticated()">
        <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>
        <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
        <script th:src="@{/js/realtime.js}"></script>
    </th:block>
</th:block>

</body>
</html>
