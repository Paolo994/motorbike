spring:
  application:
    name: motorbike
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/motorbike}
    username: ${DB_USER:motorbike}
    password: ${DB_PASSWORD:motorbike}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
  thymeleaf:
    cache: false
  servlet:
    multipart:
      # limite tecnico di Tomcat; il limite "reale" per le foto (5 MB) è applicato da PhotoController,
      # così l'utente riceve un messaggio chiaro invece di una risposta 413
      max-file-size: 20MB
      max-request-size: 21MB
  docker:
    compose:
      lifecycle-management: start-only

server:
  servlet:
    session:
      timeout: 2h
  tomcat:
    # oltre questa soglia Tomcat chiuderebbe la connessione invece di mostrare l'errore "file troppo grande"
    max-swallow-size: 25MB

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:MotoRide <noreply@motoride.local>}
  verification:
    token-validity: 24h
  # Se ADMIN_PASSWORD è valorizzata, all'avvio viene creato l'utente admin (se non esiste)
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@motoride.local}
    password: ${ADMIN_PASSWORD:}
  # User-Agent per i servizi esterni (feed RSS, Nominatim, Valhalla, MIMIT): le loro policy lo richiedono
  http:
    user-agent: ${APP_USER_AGENT:MotoRideBot/0.1 (+http://localhost:8080)}
  news:
    fetch-enabled: ${NEWS_FETCH_ENABLED:true}
    fetch-interval: ${NEWS_FETCH_INTERVAL:PT30M}
    # solo gli articoli più recenti di così generano notifiche (evita valanghe al primo import)
    notify-max-age: PT48H
  fuel:
    import-enabled: ${FUEL_IMPORT_ENABLED:true}
    # i dati MIMIT vengono pubblicati ogni mattina con i prezzi delle 8
    import-cron: "0 30 9 * * *"
    stations-url: https://www.mimit.gov.it/images/exportCSV/anagrafica_impianti_attivi.csv
    prices-url: https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv
  routing:
    # istanza pubblica FOSSGIS: uso moderato. In produzione: istanza Valhalla propria o a pagamento
    valhalla-url: ${VALHALLA_URL:https://valhalla1.openstreetmap.de}
  geocoding:
    nominatim-url: ${NOMINATIM_URL:https://nominatim.openstreetmap.org}
  # Modalità AI: consigli di alloggi, cose da vedere e ristoranti per ogni tappa.
  # Luoghi, valutazioni e recensioni arrivano da Google Places; Claude sceglie e motiva.
  # Richiede ANTHROPIC_API_KEY e GOOGLE_PLACES_API_KEY.
  ai:
    enabled: ${AI_ENABLED:false}
    model: ${AI_MODEL:claude-opus-5-5}
    effort: ${AI_EFFORT:medium}
    max-requests-per-hour: 10
    cache-ttl: PT6H
  places:
    api-key: ${GOOGLE_PLACES_API_KEY:}
    base-url: https://places.googleapis.com
