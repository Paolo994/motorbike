<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifiche')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container" style="max-width: 760px">
    <h1 class="h3 mb-4">Notifiche</h1>

    <div th:if="${#lists.isEmpty(notifications)}" class="card card-body text-center text-muted shadow-sm">
        <p class="mb-1"><i class="bi bi-bell-slash display-6"></i></p>
        Nessuna notifica per ora.
    </div>

    <div class="list-group shadow-sm" th:unless="${#lists.isEmpty(notifications)}">
        <a th:each="n : ${notifications}" th:href="${n.link != null and n.link.startsWith('/')} ? @{${n.link}} : '#'"
           class="list-group-item list-group-item-action py-3" th:classappend="${!n.read} ? 'notif-unread'">
            <div class="d-flex justify-content-between gap-2">
                <span class="fw-semibold">
                    <i class="bi me-1" th:classappend="${n.type.name() == 'NEWS'} ? 'bi-newspaper' :
                        (${n.type.name() == 'TRIP_INVITE'} ? 'bi-signpost-split' : 'bi-person-badge')"></i>
                    <span th:text="${n.title}">Titolo</span>
                </span>
                <time class="small text-muted flex-shrink-0" data-local th:datetime="${n.createdAt}"
                      th:text="${#temporals.format(n.createdAt, 'dd/MM HH:mm')}">ora</time>
            </div>
            <div class="small text-muted" th:if="${n.body}" th:text="${n.body}">testo</div>
        </a>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
